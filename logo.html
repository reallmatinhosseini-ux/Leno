<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LENO WEAR · Logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--cream:#F4EEE4;--red:#D71E28;--ink:#0B0B0B}
body{margin:0;font-family:"Archivo",sans-serif;background:var(--cream);color:var(--ink)}
.k{display:inline-block;background:currentColor;-webkit-mask:url(p/kiss-tag.png) center/contain no-repeat;mask:url(p/kiss-tag.png) center/contain no-repeat;aspect-ratio:220/132}
.lock{display:inline-flex;align-items:center;gap:.5em}
.lock .k{height:1.35em;color:var(--red)}
.wm{display:grid;line-height:1}
.wm b{font-weight:900;font-stretch:125%;letter-spacing:.08em;font-size:1em}
.wm small{font-family:"IBM Plex Mono",monospace;font-size:.24em;letter-spacing:.62em;margin-top:.5em;font-weight:500}
.stack{display:inline-grid;justify-items:center;gap:.25em}
.stack .k{height:2.2em;color:var(--red)}
.stack .wm{justify-items:center}
section{min-height:46vh;display:grid;place-items:center;padding:40px}
.red{background:var(--red);color:var(--cream)} .red .k{color:var(--cream)!important}
.blk{background:var(--ink);color:var(--cream)}
.row{display:flex;gap:60px;flex-wrap:wrap;align-items:center;justify-content:center}
</style></head><body>
<section><div class="row"><span class="lock" style="font-size:44px"><span class="k"></span><span class="wm"><b>LENO WEAR</b><small>LEAVE YOUR MARK</small></span></span><span class="stack" style="font-size:40px"><span class="k"></span><span class="wm"><b>LENO WEAR</b><small>LEAVE YOUR MARK</small></span></span></div></section>
<section class="red"><div class="row"><span class="lock" style="font-size:44px"><span class="k"></span><span class="wm"><b>LENO WEAR</b><small>LEAVE YOUR MARK</small></span></span><span class="k" style="height:120px"></span></div></section>
<section class="blk"><div class="row"><span class="lock" style="font-size:44px"><span class="k" style="color:var(--red)"></span><span class="wm"><b>LENO WEAR</b><small>LEAVE YOUR MARK</small></span></span><span class="k" style="height:32px;color:var(--red)"></span><span class="k" style="height:16px;color:var(--red)"></span></div></section>
</body></html>
